<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<style>
  body { font-family: "Segoe UI", Arial, sans-serif; width: 260px; margin: 0; padding: 14px; color: #1d2b3a; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  p { font-size: 12px; color: #5a6b7b; margin: 0 0 10px; }
  input { width: 100%; box-sizing: border-box; padding: 7px 8px; font-size: 14px; border: 1px solid #c4ced8; border-radius: 6px; direction: ltr; text-align: left; }
  .row { display: flex; gap: 6px; margin-top: 10px; }
  button { flex: 1; padding: 7px; font-size: 13px; border-radius: 6px; border: 1px solid #c4ced8; background: #fff; cursor: pointer; }
  button.primary { background: #0b5cad; border-color: #0b5cad; color: #fff; }
  #status { font-size: 12px; margin-top: 8px; min-height: 16px; color: #1f7a3a; }
</style>
</head>
<body>
  <h1>מילוי אוטומטי – מספר זהות</h1>
  <p>המספר נשמר רק במחשב הזה וממולא אוטומטית בדף הכניסה של האוניברסיטה הפתוחה.</p>
  <input id="id" type="tel" inputmode="numeric" maxlength="9" placeholder="מספר זהות">
  <div class="row">
    <button id="save" class="primary">שמירה</button>
    <button id="clear">מחיקה</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
